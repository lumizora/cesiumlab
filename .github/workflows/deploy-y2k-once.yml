name: One-time publish React Astryx Y2K homepage

# Explicitly requested one-off deployment for PR #1.
# Only the merge that advances the known main commit and adds App.tsx can run.
# Delete this temporary workflow immediately after the deployment completes.
on:
  push:
    branches: [main]
    paths:
      - 'apps/playground/src/App.tsx'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.event.before == 'b1db91a467e74a1329b31bb1346c1c7bbe123139'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check production source
        run: pnpm check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub project Pages
        run: pnpm build:base
        env:
          DEPLOY_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CESIUM_ION_TOKEN: ${{ vars.CESIUM_ION_TOKEN }}
      - name: Verify base path assets
        working-directory: apps/playground
        run: node scripts/check-dist.mjs dist-base "$DEPLOY_BASE_PATH"
        env:
          DEPLOY_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist-base
          retention-days: 30

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish explicitly requested release
        id: deployment
        uses: actions/deploy-pages@v4
